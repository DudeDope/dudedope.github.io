name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "_bibliography/**"
      - "_books/**"
      - "_data/**"
      - "_news/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "_research/**"
      - "_teachings/**"
      - ".github/workflows/deploy.yml"
      - "*.md"
      - "*.yml"
      - "bin/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "package.json"
      - "package-lock.json"
      - "purgecss.config.js"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install cached frontend tools
        run: npm ci --ignore-scripts

      - name: Validate note sources
        run: npm run test:notes:source

      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config.production.yml

      - name: Remove unused CSS
        run: npm run build:purgecss

      - name: Validate generated site
        env:
          PORTFOLIO_BASEURL: "/"
        run: python3 test/validate_portfolio.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
