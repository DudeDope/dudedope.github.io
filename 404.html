<style type="text/css" media="screen">
  .container {
    margin: 10px auto;
    max-width: 600px;
    text-align: center;
  }
  h1 {
    margin: 30px 0;
    font-size: 4em;
    line-height: 1;
    letter-spacing: -1px;
  }
  .error-code {
    color: #e0491f;
  }
  .error-message {
    font-size: 1.2em;
    color: #666;
    margin-bottom: 2rem;
  }
  .home-link {
    display: inline-block;
    background-color: #e0491f;
    color: white;
    padding: 12px 24px;
    text-decoration: none;
    border-radius: 5px;
    transition: background-color 0.3s ease;
  }
  .home-link:hover {
    background-color: #ff8f26;
    text-decoration: none;
  }
</style>

<div class="container">
  <h1><span class="error-code">404</span></h1>
  
  <p class="error-message"><strong>Page not found :(</strong></p>
  <p>The requested page could not be found. It might have been moved, deleted, or you entered the wrong URL.</p>
  
  <a href="{{ "/" | relative_url }}" class="home-link">Go back home</a>
</div>
