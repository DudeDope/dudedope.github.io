        summary: Applied machine learning, probabilistic modelling, and optimisation for energy-system monitoring, forecasting, and electricity-market decision support.
        highlights:
          - Developing degradation and performance models, machine-learning and deep-learning methods for anomaly and alert prediction, and survival-modelling workflows.
          - Applying vine-copula methods to model dependence between solar generation and weather variables and support probabilistic forecasting.
          - Studying stochastic market-clearing-price (MCP) models and quantile-based bidding strategies for electricity-market decisions.
          - Building Python pipelines for time-aware evaluation, backtesting, operational optimisation under battery constraints, and decision support.

      - company: Mercity AI
        position: Machine Learning Research Intern
        location: Bengaluru
        start_date: 2025-04
        end_date: 2025-08
        summary: Compact multimodal modelling for medical image caption generation.
        highlights:
          - Connected medSigLIP and Qwen-2.5-7B through a Q-Former, compressing 256 image tokens into 32 latent queries.
          - Achieved an 8× visual-token compression and approximately 70% memory reduction while preserving probabilistic calibration in the frozen-language-model setup.
          - Trained the Q-Former with cross-entropy on MIMIC captions and explored SFT, PPO, DPO, and GRPO with the Hugging Face trl stack.
          - Extended a DeepSeek-R1 GRPO workflow to multimodal inputs; recorded improved BLEU and lower perplexity in the reported experiments.

    Projects:
      - name: "Stein's Paradox: Inadmissibility and Risk-Optimal Shrinkage"
        summary: Supervised by Dr. Ayanendranath Basu, Indian Statistical Institute.
        highlights:
          - Studied inadmissibility of the usual estimator for multivariate normal means when d ≥ 3.
          - Compared James–Stein and mean-centred shrinkage, heteroscedastic whitening, Normal–Normal empirical Bayes, Monte Carlo risk, and SURE.
          - Recovered uniform James–Stein dominance and observed the lowest heteroscedastic simulation risk for the MMLE estimator.

      - name: Bivariate Copula Modelling of Extreme Air Pollution Events
        summary: Supervised by Dr. Shyamal Krishna De, Indian Statistical Institute.
        highlights:
          - Modelled duration and severity of AQI episodes in Bengaluru from 2015–2024 using six copula families and nonparametric marginals.
          - Estimated Kendall's τ = 0.881 and Spearman's ρ = 0.972; the selected Gumbel model had θ = 6.183 and upper-tail dependence 0.881.
          - Obtained a model-derived estimate P(S > 2000 given D ≥ 12) ≈ 0.9998 under the project's definitions.

      - name: "Sequential Testing: Optimal Stopping under a Reward–Cost Trade-off"
        summary: Supervised by Dr. Arnab Chakraborty, Indian Statistical Institute.
        highlights:
          - Formulated a Bellman recursion over the state S(x, y) and implemented memoised dynamic programming with backtracking and cutoffs.
          - For N = 20 and C = 5, the specified instance produced an expected gain of 7.6875.

      - name: Variance-Based Audio Denoising via Amplitude Thresholding
        summary: Supervised by Dr. Arnab Chakraborty, Indian Statistical Institute.
        highlights:
          - Estimated local variance over approximately 0.1-second windows and used a modal variance-bin cutoff for suppression and scaling.
          - Implemented the workflow in R with time-domain and FFT-based diagnostics.

      - name: Elo-Based Football Betting
        summary: Supervised by Dr. Ayanendranath Basu, Indian Statistical Institute.
        highlights:
          - Modelled English Premier League outcomes from 2014–2024 with Elo features and logistic regression.
          - Recorded a Brier score of 0.2176 and log loss of 0.6249.
          - A historical value-betting simulation returned 5,139 units of profit on a 10,000-unit test bankroll; this is a retrospective simulation, not a claim of future profitability.

